<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3b31">
<title>املاک حامدی</title>
<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --ink:#14231f; --muted:#5f716b;
  --brand:#0e7a5f; --brand-2:#0a5c47; --brand-dark:#0b3b31;
  --gold:#d9a13b; --gold-ink:#3a2800;
  --line:#e2e9e5; --red:#e11d48; --blue:#2563eb;
  --logo-bg:#201f1c;
  --sh:0 6px 24px rgba(15,40,35,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
.ic{width:1.05em;height:1.05em;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:none}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
.logo .mark{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none;background:var(--logo-bg);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.logo .mark svg{width:100%;height:100%}
.logo .brand{min-width:0;line-height:1.3}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-actions{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13.5px;transition:.2s;white-space:nowrap}
.btn-brand{background:var(--brand);color:#fff}
.btn-brand:hover{background:var(--brand-2)}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-gold:hover{background:#c68f2d}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px}

/* hero slim */
.hero{color:#fff;background:
 radial-gradient(circle at 88% 10%,rgba(217,161,59,.22),transparent 42%),
 radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
 linear-gradient(135deg,var(--brand-dark),#116953);
 background-size:auto,22px 22px,auto;
 text-align:center;padding:20px 0 52px}
.hero h1{font-size:clamp(18px,3.2vw,26px);font-weight:800;line-height:1.6;margin-bottom:6px}
.hero h1 em{font-style:normal;color:#ffd98a}
.hero p{font-size:13px;color:#d7ece4}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-top:-34px;position:relative;z-index:5}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fi{flex:1 1 140px;min-width:120px}
.fi.grow{flex:2 1 220px}
.fi label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fi input,.fi select,.fi textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fbfdfc;outline:none;transition:.15s}
.fi textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,122,95,.13)}
.seg{display:inline-flex;background:#eaf1ee;border-radius:11px;padding:3px;gap:3px;height:42px;align-items:center}
.seg button{border:none;background:transparent;border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#4c5f59;white-space:nowrap;height:100%}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(15,40,35,.12)}

/* resbar */
.resbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;flex-wrap:wrap;gap:8px}
#count{font-size:13.5px;font-weight:700;color:var(--muted)}
#count b{color:var(--brand);font-size:15px}
.note{display:none;width:100%;font-size:12.5px;border-radius:10px;padding:8px 12px;line-height:1.7}
.note.err{color:#7f1d1d;background:#fee2e2;border:1px solid #fca5a5;font-weight:700}
.note.warn{color:#92400e;background:#fef3c7;border:1px solid #fcd34d}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(520px,100%),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:.2s;display:flex;flex-direction:row;min-height:180px;outline:none}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,40,35,.14)}
.cbody{flex:1 1 auto;min-width:0;padding:12px 14px;display:flex;flex-direction:column}
.cbody h3{font-size:15px;font-weight:800;margin-bottom:2px;line-height:1.5}
.loc{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.cdesc{font-size:12.5px;color:#4c5f59;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.b{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px;line-height:1.7}
.b-sale{background:var(--brand);color:#fff}
.b-rent{background:var(--blue);color:#fff}
.b-alley{background:#fef3c7;color:#92400e}
.b-street{background:#ecfdf5;color:#065f46}
.b-new{background:#111827;color:#fff}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.sp{background:#f1f6f3;border-radius:8px;padding:2px 8px;font-size:11px;color:var(--muted)}
.sp b{color:var(--ink);font-size:12px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);flex-wrap:wrap}
.price{font-weight:800;color:var(--brand);font-size:14px;line-height:1.4}
.price small{font-size:10.5px;font-weight:600}
.price .sub{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
.card-actions{display:flex;gap:6px}
.btn-icon{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{border-color:var(--brand);color:var(--brand)}
.btn-icon.danger:hover{border-color:var(--red);color:var(--red);background:#fff1f2}
.cimg{flex:0 0 140px;position:relative;background:var(--logo-bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cimg img{width:100%;height:100%;object-fit:cover}

/* empty */
.empty{display:none;text-align:center;padding:40px 16px;background:#fff;border:1.5px dashed var(--line);border-radius:16px}
.empty h3{margin-bottom:6px;font-size:15px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:10px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,18,15,.6);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:680px;width:100%;position:relative;overflow:hidden;margin:auto}
.mclose{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.95);font-size:14px;font-weight:800;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mimg{background:var(--logo-bg);display:flex;align-items:center;justify-content:center;padding:14px;min-height:140px}
.mimg img{height:160px;max-width:100%;object-fit:contain}
.mbody{padding:18px 16px 20px}
.mbadges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.mbody h2{font-size:18px;margin-bottom:2px;line-height:1.5}
.mbody .loc{font-size:12.5px;margin-bottom:12px}
.mspecs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.ms{background:#f4f8f6;border-radius:10px;padding:7px 10px}
.ms span{display:block;font-size:10.5px;color:var(--muted)}
.ms b{font-size:12.5px}
.mdesc{font-size:13px;color:#3d4f49;margin-bottom:12px}
.mfeats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mf{display:inline-flex;align-items:center;gap:4px;background:#eaf6f1;color:var(--brand-2);font-size:11.5px;font-weight:700;border-radius:99px;padding:5px 10px}
.mprice{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px}
.mprice .p1{font-size:16px;font-weight:800}
.mprice .p2{font-size:12px;color:#d7ece4}
.mcontact{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#f7faf8;border:1px solid var(--line);border-radius:14px;padding:10px 12px}

/* form modal */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1 / -1}
.f-title{font-size:16px;font-weight:800;margin-bottom:12px;color:var(--brand-dark)}
.hint{font-size:11px;color:var(--muted);margin-top:3px}
.check-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.check-row input{width:18px;height:18px}

/* fab */
.fab-wrap{position:fixed;bottom:16px;left:16px;right:16px;z-index:60;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.fab-wrap .btn{pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:12px 18px;font-size:14px;border-radius:14px}

/* toast */
#toast{position:fixed;bottom:22px;right:50%;transform:translate(50%,80px);background:#14231f;color:#fff;padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;z-index:99;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(50%,0)}

@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  .card{min-height:130px}
  .cimg{flex-basis:110px}
  .form-grid{grid-template-columns:1fr}
  .fab-wrap{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="#" onclick="window.scrollTo(0,0);return false">
      <span class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><radialGradient id="hbg" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#2a2926"/><stop offset="1" stop-color="#171614"/></radialGradient><linearGradient id="hau" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a5a13"/><stop offset=".5" stop-color="#c9962e"/><stop offset="1" stop-color="#e8c56a"/></linearGradient></defs><rect width="512" height="512" fill="#201f1c"/><rect width="512" height="512" fill="url(#hbg)"/><g transform="translate(256 256) scale(1.2) translate(-256 -213)"><g fill="none" stroke="url(#hau)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"><path d="M150 299V150h16v20h22v-20h16v122M226 261V96h18v22h24V96h18v165M308 272V132h16v20h22v-20h16v167"/><path d="M150 214h54M226 176h60M308 200h54" stroke-width="14" opacity=".85"/><path d="M88 330L256 246L424 330"/></g><g fill="url(#hau)"><rect x="233" y="282" width="18" height="18" rx="2"/><rect x="261" y="282" width="18" height="18" rx="2"/><rect x="233" y="310" width="18" height="18" rx="2"/><rect x="261" y="310" width="18" height="18" rx="2"/></g></g></svg>
      </span>
      <span class="brand">املاک جواد حامدی<small>شوش دانیال • خرید، فروش، رهن و اجاره</small></span>
    </a>
    <div class="hd-actions">
      <button class="btn btn-gold btn-sm" id="btnExport" type="button">📤 استخراج</button>
      <button class="btn btn-brand btn-sm" id="btnAdd" type="button">➕ افزودن ملک</button>
      <a class="btn btn-ghost btn-sm" href="tel:+989163456044">📞 ۰۹۱۶ ۳۴۵ ۶۰۴۴</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>مدیریت ملک‌ها در <em>املاک حامدی</em></h1>
    <p>جستجو، افزودن، ویرایش، حذف و استخراج properties.json</p>
  </div>
</section>

<div class="wrap">
  <div class="panel">
    <div class="frow">
      <div class="fi grow">
        <label for="fq">جستجو</label>
        <input id="fq" type="search" autocomplete="off" placeholder="محله، عنوان، نوع ملک…">
      </div>
      <div class="fi">
        <label>نوع معامله</label>
        <div class="seg" id="fdeal" role="group">
          <button type="button" data-v="all" class="on">همه</button>
          <button type="button" data-v="sale">فروش</button>
          <button type="button" data-v="rent">رهن و اجاره</button>
        </div>
      </div>
      <div class="fi">
        <label for="ftype">نوع ملک</label>
        <select id="ftype">
          <option value="all">همه</option>
          <option value="apartment">آپارتمان</option>
          <option value="villa">ویلا / خانه</option>
          <option value="land">زمین</option>
          <option value="shop">مغازه</option>
        </select>
      </div>
      <div class="fi">
        <label for="fsort">مرتب‌سازی</label>
        <select id="fsort">
          <option value="new">جدیدترین</option>
          <option value="cheap">ارزان‌ترین</option>
          <option value="exp">گران‌ترین</option>
          <option value="area">بیشترین متراژ</option>
        </select>
      </div>
    </div>
    <div class="frow" style="margin-top:10px">
      <div class="fi">
        <label for="falley">موقعیت</label>
        <select id="falley">
          <option value="all">همه</option>
          <option value="alley">داخل کوچه</option>
          <option value="street">بر خیابان</option>
        </select>
      </div>
      <div class="fi">
        <label for="frooms">خواب</label>
        <select id="frooms">
          <option value="all">همه</option>
          <option value="1">۱ خواب</option>
          <option value="2">۲ خواب</option>
          <option value="3">۳ خواب</option>
          <option value="4">۴+ خواب</option>
        </select>
      </div>
      <div class="fi">
        <label for="famin">متراژ از</label>
        <input id="famin" type="text" inputmode="numeric" placeholder="مثلاً ۸۰">
      </div>
      <div class="fi">
        <label for="famax">تا</label>
        <input id="famax" type="text" inputmode="numeric" placeholder="مثلاً ۱۵۰">
      </div>
      <div class="fi">
        <label>&nbsp;</label>
        <button class="btn btn-ghost btn-sm" id="freset" type="button" style="width:100%">✕ حذف فیلتر</button>
      </div>
    </div>
  </div>

  <div class="resbar">
    <div id="count"></div>
    <div id="loaderr" class="note err"></div>
    <div id="syncnote" class="note warn"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <h3>ملکی یافت نشد</h3>
    <p>فیلترها را تغییر دهید یا ملک جدید اضافه کنید.</p>
    <button class="btn btn-gold" type="button" id="emptyAdd">➕ افزودن ملک</button>
  </div>
</div>

<div class="fab-wrap">
  <button class="btn btn-gold" id="fabExport" type="button">📤 استخراج به Documents/properties.json</button>
  <button class="btn btn-brand" id="fabAdd" type="button">➕ ملک جدید</button>
</div>

<!-- Detail modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox" id="mbox"></div>
</div>

<!-- Form modal -->
<div class="modal" id="formModal" role="dialog" aria-modal="true">
  <div class="mbox" style="max-width:760px">
    <button class="mclose" type="button" onclick="closeForm()">✕</button>
    <div class="mbody">
      <div class="f-title" id="formTitle">افزودن ملک جدید</div>
      <div class="form-grid" id="formGrid">
        <!-- fields injected by JS in exact 20-field order -->
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-brand" id="btnSave" type="button">💾 ذخیره</button>
        <button class="btn btn-ghost" type="button" onclick="closeForm()">انصراف</button>
        <span id="formHint" class="hint" style="margin-inline-start:auto"></span>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ---------- constants from index.html ----------
const LOGO_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="املاک جواد حامدی"><defs><radialGradient id="lbg" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#2a2926"/><stop offset="1" stop-color="#171614"/></radialGradient><linearGradient id="lau" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a5a13"/><stop offset=".5" stop-color="#c9962e"/><stop offset="1" stop-color="#e8c56a"/></linearGradient></defs><rect width="512" height="512" fill="#201f1c"/><rect width="512" height="512" fill="url(#lbg)"/><g transform="translate(256 256) scale(1) translate(-256 -213)"><g fill="none" stroke="url(#lau)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M150 299V150h16v20h22v-20h16v122M226 261V96h18v22h24V96h18v165M308 272V132h16v20h22v-20h16v167"/><path d="M150 214h54M226 176h60M308 200h54" stroke-width="6" opacity=".85"/><path d="M88 330L256 246L424 330"/></g><g fill="url(#lau)"><rect x="233" y="282" width="18" height="18" rx="2"/><rect x="261" y="282" width="18" height="18" rx="2"/><rect x="233" y="310" width="18" height="18" rx="2"/><rect x="261" y="310" width="18" height="18" rx="2"/></g></g></svg>';
const LOGO_FULL_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="املاک جواد حامدی"><defs><radialGradient id="fbg" cx="50%" cy="45%" r="72%"><stop offset="0" stop-color="#2a2926"/><stop offset="1" stop-color="#171614"/></radialGradient><linearGradient id="fau" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a5a13"/><stop offset=".5" stop-color="#c9962e"/><stop offset="1" stop-color="#e8c56a"/></linearGradient></defs><rect width="512" height="512" fill="#201f1c"/><rect width="512" height="512" fill="url(#fbg)"/><g transform="translate(256 228) scale(1) translate(-256 -213)"><g fill="none" stroke="url(#fau)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M150 299V150h16v20h22v-20h16v122M226 261V96h18v22h24V96h18v165M308 272V132h16v20h22v-20h16v167"/><path d="M150 214h54M226 176h60M308 200h54" stroke-width="6" opacity=".85"/><path d="M88 330L256 246L424 330"/></g><g fill="url(#fau)"><rect x="233" y="282" width="18" height="18" rx="2"/><rect x="261" y="282" width="18" height="18" rx="2"/><rect x="233" y="310" width="18" height="18" rx="2"/><rect x="261" y="310" width="18" height="18" rx="2"/></g></g><text x="256" y="440" text-anchor="middle" direction="rtl" font-family="Vazirmatn,Vazir,IRANSansX,Segoe UI,Tahoma,Arial,sans-serif" font-size="34" font-weight="700" fill="url(#fau)">مشاور املاک جواد حامدی</text></svg>';
const LOGO='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG);
const LOGO_FULL='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_FULL_SVG);

const PRIMARY_URL='https://raw.githubusercontent.com/javadxpro/amlak/refs/heads/main/properties.json';
const FALLBACK_URL='https://javadxpro.github.io/amlak/properties.json';

// 20-field order as per spec
const FIELD_ORDER=["id","title","neighborhood","deal","type","area","rooms","floor","buildYear","price","pricePerMeter","deposit","rent","inAlley","parking","elevator","storage","image","description","features"];

const TYPES={apartment:'آپارتمان',villa:'ویلا / خانه',land:'زمین',shop:'مغازه'};
const FA='۰۱۲۳۴۵۶۷۸۹';
const faNum=s=>String(s).replace(/\d/g,d=>FA[+d]).replace(/,/g,'٬').replace(/\./g,'٫');
const enNum=s=>String(s).replace(/[۰-۹]/g,d=>String(FA.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(s){s=enNum(String(s)).replace(/٫/g,'.').replace(/[^\d.]/g,'');if(s==='')return null;const n=parseFloat(s);return isNaN(n)?null:n;}
function toNum(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='string')return num(v);return null;}
function money(t){
  t=+t||0;
  if(!t)return 'توافقی';
  const fmt=(v,d)=>{const m=Math.pow(10,d);return faNum(String(Math.round(v*m)/m));};
  if(t>=1e9)return fmt(t/1e9,2)+' میلیارد';
  if(t>=1e6)return fmt(t/1e6,1)+' میلیون';
  if(t>=1e3)return fmt(t/1e3,0)+' هزار';
  return faNum(t);
}
const normTxt=s=>enNum(String(s)).toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim();

// ---------- normalize ----------
function normalize(p,i){
  p=p&&typeof p==='object'?p:{};
  const type=TYPES[p.type]?p.type:'apartment';
  const deal=(p.deal==='rent'||p.deal==='اجاره'||p.deal==='رهن و اجاره')?'rent':'sale';
  const id=toNum(p.id);
  return {
    id:id===null?(i+1):id,
    t:String(p.title||p.t||'بدون عنوان'),
    hood:String(p.neighborhood||p.hood||'شوش دانیال'),
    deal:deal,
    type:type,
    area:toNum(p.area)||0,
    rooms:toNum(p.rooms)||0,
    floor:(p.floor===undefined||p.floor===null||p.floor==='')?null:String(p.floor),
    year:toNum(p.buildYear!==undefined?p.buildYear:p.year),
    price:toNum(p.price)||0,
    ppm:toNum(p.pricePerMeter)||0,
    dep:toNum(p.deposit)||0,
    rent:toNum(p.rent)||0,
    alley:p.inAlley===true||p.inAlley==='true'||p.inAlley===1,
    park:!!p.parking,
    elv:!!p.elevator,
    stor:!!p.storage,
    img:(typeof p.image==='string'&&p.image&&p.image!=='logo')?p.image:'logo',
    desc:String(p.description||''),
    feat:Array.isArray(p.features)?p.features.map(String):[]
  };
}
function parseData(txt){
  let d=JSON.parse(txt);
  if(!Array.isArray(d)){
    if(d&&Array.isArray(d.properties))d=d.properties;
    else throw new Error('bad json');
  }
  return d.map(normalize);
}
function toOrderedProperty(p){
  // p is normalized internal, convert to 20-field ordered object matching spec
  const o={};
  o.id=p.id;
  o.title=p.t;
  o.neighborhood=p.hood;
  o.deal=p.deal;
  o.type=p.type;
  o.area=p.area;
  o.rooms=p.rooms;
  o.floor=p.floor;
  o.buildYear=p.year;
  o.price=p.price;
  o.pricePerMeter=p.ppm;
  o.deposit=p.dep;
  o.rent=p.rent;
  o.inAlley=p.alley;
  o.parking=p.park;
  o.elevator=p.elv;
  o.storage=p.stor;
  o.image=p.img;
  o.description=p.desc;
  o.features=p.feat;
  // Ensure order by creating new object with FIELD_ORDER
  const ordered={};
  FIELD_ORDER.forEach(k=>{ordered[k]=o[k];});
  return ordered;
}
function exportJsonString(){
  const arr=P.map(toOrderedProperty);
  // Preserve key order: JSON.stringify respects insertion order
  return JSON.stringify({properties:arr}, null, 2);
}

// ---------- filtering ----------
function apply(){
  const q=normTxt($('#fq').value);
  const type=$('#ftype').value, alley=$('#falley').value, rooms=$('#frooms').value;
  const amin=num($('#famin').value), amax=num($('#famax').value);
  const sort=$('#fsort').value;
  let list=P.filter(p=>{
    if(curDeal!=='all'&&p.deal!==curDeal)return false;
    if(type!=='all'&&p.type!==type)return false;
    if(alley==='alley'&&!p.alley)return false;
    if(alley==='street'&&p.alley)return false;
    if(rooms!=='all'){if(rooms==='4'){if(p.rooms<4)return false}else if(p.rooms!==+rooms)return false;}
    if(amin!==null&&p.area<amin)return false;
    if(amax!==null&&p.area>amax)return false;
    if(q){
      const hay=normTxt(p.t+' '+p.hood+' '+TYPES[p.type]+' '+p.desc+' '+(p.alley?'داخل کوچه':'بر خیابان'));
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const priceOf=p=>p.deal==='rent'?(p.dep||p.rent):p.price;
  if(sort==='cheap')list.sort((a,b)=>priceOf(a)-priceOf(b));
  else if(sort==='exp')list.sort((a,b)=>priceOf(b)-priceOf(a));
  else if(sort==='area')list.sort((a,b)=>b.area-a.area);
  else list.sort((a,b)=>(b.year||0)-(a.year||0)||b.id-a.id);
  $('#grid').innerHTML=list.map(cardHTML).join('');
  $('#count').innerHTML=`<b>${faNum(list.length)}</b> ملک از ${faNum(P.length)} ثبت‌شده`;
  $('#empty').style.display=list.length?'none':'block';
}

function setDeal(v){
  curDeal=v;
  $$('#fdeal button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  apply();
}
function resetFilters(){
  $('#fq').value='';$('#ftype').value='all';$('#falley').value='all';$('#frooms').value='all';

}

// ---------- form handling ----------
function buildFormFields(){
  // Build inputs for 20 fields in order, but with friendly UI
  const container=$('#formGrid');
  container.innerHTML='';
  const fieldDefs=[
    {k:'id',label:'شناسه (id)',type:'number',hint:'یک عدد یکتا، مثلاً 11'},
    {k:'title',label:'عنوان (title)',type:'text',full:true,hint:'مثلاً: آپارتمان ۹۵ متری کوی دانیال'},
    {k:'neighborhood',label:'محله (neighborhood)',type:'text',full:true},
    {k:'deal',label:'نوع معامله (deal)',type:'select',options:[['sale','فروش'],['rent','رهن و اجاره']]},
    {k:'type',label:'نوع ملک (type)',type:'select',options:[['apartment','آپارتمان'],['villa','ویلا / خانه'],['land','زمین'],['shop','مغازه']]},
    {k:'area',label:'متراژ (area)',type:'number'},
    {k:'rooms',label:'تعداد خواب (rooms)',type:'number'},
    {k:'floor',label:'طبقه (floor)',type:'text',hint:'مثلاً: ۲ از ۴ یا همکف'},
    {k:'buildYear',label:'سال ساخت (buildYear)',type:'number',hint:'مثلاً 1403'},
    {k:'price',label:'قیمت کل (price) تومان',type:'number'},
    {k:'pricePerMeter',label:'قیمت هر متر (pricePerMeter)',type:'number'},
    {k:'deposit',label:'رهن (deposit)',type:'number'},
    {k:'rent',label:'اجاره ماهانه (rent)',type:'number'},
    {k:'inAlley',label:'داخل کوچه است؟ (inAlley)',type:'checkbox'},
    {k:'parking',label:'پارکینگ دارد؟ (parking)',type:'checkbox'},
    {k:'elevator',label:'آسانسور دارد؟ (elevator)',type:'checkbox'},
    {k:'storage',label:'انباری دارد؟ (storage)',type:'checkbox'},
    {k:'image',label:'تصویر (image)',type:'text',hint:'مقدار logo یعنی لوگوی سایت'},
    {k:'description',label:'توضیحات (description)',type:'textarea',full:true},
    {k:'features',label:'امکانات (features) — هر مورد در یک خط',type:'textarea',full:true}
  ];
  fieldDefs.forEach(fd=>{
    const div=document.createElement('div');
    div.className='fi'+(fd.full?' full':'');
    let inputHtml='';
    if(fd.type==='select'){
      inputHtml=`<select id="f_${fd.k}">${fd.options.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
    }else if(fd.type==='checkbox'){
      inputHtml=`<div class="check-row"><input type="checkbox" id="f_${fd.k}"><label for="f_${fd.k}">${fd.label}</label></div>`;
    }else if(fd.type==='textarea'){
      inputHtml=`<label for="f_${fd.k}">${fd.label}</label><textarea id="f_${fd.k}" rows="3"></textarea>${fd.hint?`<div class="hint">${fd.hint}</div>`:''}`;
    }else{
      inputHtml=`<label for="f_${fd.k}">${fd.label}</label><input id="f_${fd.k}" type="${fd.type==='number'?'text':'text'}" inputmode="${fd.type==='number'?'numeric':'text'}">${fd.hint?`<div class="hint">${fd.hint}</div>`:''}`;
    }
    if(fd.type!=='textarea' && fd.type!=='checkbox'){
      // wrap label inside already
      if(fd.type==='select'){
        div.innerHTML=`<label>${fd.label}</label>${inputHtml}${fd.hint?`<div class="hint">${fd.hint}</div>`:''}`;
      }else{
        div.innerHTML=inputHtml;
      }
    }else{
      div.innerHTML=inputHtml;
    }
    container.appendChild(div);
  });
}

function collectForm(){
  try{
    const id=num($('#f_id').value);
    if(id===null){toast('شناسه نامعتبر');return null;}
    const title=$('#f_title').value.trim();
    if(!title){toast('عنوان را وارد کنید');return null;}
    const hood=$('#f_neighborhood').value.trim()||'شوش دانیال';
    const deal=$('#f_deal').value;
    const type=$('#f_type').value;
    const area=num($('#f_area').value)||0;
    const rooms=num($('#f_rooms').value)||0;
    const floor=$('#f_floor').value.trim()||null;
    const buildYear=num($('#f_buildYear').value);
    const price=num($('#f_price').value)||0;
    const ppm=num($('#f_pricePerMeter').value)||0;
    const dep=num($('#f_deposit').value)||0;
    const rent=num($('#f_rent').value)||0;
    const inAlley=$('#f_inAlley').checked;
    const parking=$('#f_parking').checked;
    const elevator=$('#f_elevator').checked;
    const storage=$('#f_storage').checked;
    const image=$('#f_image').value.trim()||'logo';
    const desc=$('#f_description').value.trim();
    const featRaw=$('#f_features').value.split('\n').map(s=>s.trim()).filter(s=>s);
    // normalized internal
    const p={
      id:id,
      t:title,
      hood:hood,
      deal:deal,
      type:type,
      area:area,
      rooms:rooms,
      floor:floor,
      year:buildYear,
      price:price,
      ppm:ppm,
      dep:dep,
      rent:rent,
      alley:inAlley,
      park:parking,
      elv:elevator,
      stor:storage,
      img:image,
      desc:desc,
      feat:featRaw
    };
    return p;
  }catch(e){toast('خطا در فرم');return null;}
}

function saveProperty(){
  const p=collectForm();
  if(!p)return;
  if(editingId!==null){
    const idx=P.findIndex(x=>x.id===editingId);
    if(idx>=0){
      // if id changed? but disabled, so same
      P[idx]=p;
      toast('ویرایش شد');
    }
  }else{
    if(P.some(x=>x.id===p.id)){toast('شناسه تکراری است');return;}
    P.push(p);
    toast('ملک اضافه شد');
  }
  saveLocal();
  apply();
  closeForm();
}

function editProperty(id){openForm(true,{id:id});}
function deleteProperty(id){
  if(!confirm('حذف ملک #'+faNum(id)+'؟'))return;
  P=P.filter(x=>x.id!==id);
  saveLocal();
  apply();
  toast('حذف شد');
}

// ---------- export ----------
function doExport(){
  const jsonStr=exportJsonString();
  if(window.Android && typeof Android.exportJson==='function'){
    Android.exportJson(jsonStr);
  }else{
    // fallback browser download
    const blob=new Blob([jsonStr],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='properties.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    toast('فایل دانلود شد (مرورگر)');
  }
}
function onExportResult(ok,msg){
  if(ok){toast('✅ '+msg);}else{toast('❌ '+msg);}
  if(window.Android) Android.log('export result: '+ok+' '+msg);
}

// ---------- fetch remote ----------
async function fetchRemote(){
  const local=loadLocal();
  if(local){P=local;apply();hideErr();}
  try{
    const r1=await fetch(PRIMARY_URL+'?v='+Date.now(),{cache:'no-store'});
    if(!r1.ok)throw new Error('HTTP '+r1.status);
    const t1=await r1.text();
    const arr1=parseData(t1);
    if(arr1.length){P=arr1;saveLocal();hideErr();apply();toast('لیست از گیت‌هاب بروز شد');return;}
  }catch(e){
    console.log('primary failed',e);
  }
  try{
    const r2=await fetch(FALLBACK_URL+'?v='+Date.now(),{cache:'no-store'});
    if(!r2.ok)throw new Error('HTTP '+r2.status);
    const t2=await r2.text();
    const arr2=parseData(t2);
    if(arr2.length){P=arr2;saveLocal();hideErr();apply();toast('لیست از Pages بروز شد');return;}
  }catch(e){
    console.log('fallback failed',e);
  }
  if(!P.length){
    // try embedded? none, use empty
    showErr('آفلاین: اتصال به اینترنت برقرار نیست، از حافظه محلی استفاده می‌شود.');
  }else{
    $('#syncnote').style.display='block';
    $('#syncnote').textContent='آفلاین یا خطای شبکه: نسخه‌ی محلی نمایش داده می‌شود. برای بروزرسانی اینترنت را چک کن.';
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeForm();}});

$('#btnExport').addEventListener('click',doExport);
