name: Build APK - املاک حامدی

on:
  push:
    branches: [ main, arena/* ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
      - 'properties.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jdk4py
        run: |
          pip install jdk4py --break-system-packages
          python -c "import jdk4py; print(jdk4py.JAVA)"
          python -c "import jdk4py; print(jdk4py.JAVA_HOME)"

      - name: Install npm tools
        working-directory: app
        run: |
          npm ci || npm install

      - name: Build APK
        working-directory: app
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amlak-hamedi-apk
          path: app/release/amlak-hamedi.apk
          if-no-files-found: error

      - name: Upload keystore artifact (for backup)
        uses: actions/upload-artifact@v4
        with:
          name: amlak-keystore
          path: app/keystore/amlak.keystore
          if-no-files-found: warn

      - name: Show APK info
        working-directory: app
        run: |
          ls -lh release/
          ls -lh keystore/
